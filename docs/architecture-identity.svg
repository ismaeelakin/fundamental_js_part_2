<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="470" viewBox="0 0 1100 470" role="img" aria-labelledby="title desc"><title id="title">Loop Trace bounded execution</title><desc id="desc">Validated bounds feed a fixed integer loop with a 1,000-step guard. Exact trace records become a table and JSON download; truncation is explicit.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#e0c746"/></marker></defs><rect width="1100" height="470" fill="#202326"/><g font-family="Consolas, Liberation Mono, monospace" fill="#edf0e9" color="#edf0e9"><text x="30" y="45" font-size="27" fill="#edf0e9" font-weight="bold" text-anchor="start">LOOP TRACE // BOUNDED EXECUTION</text><text x="30" y="77" font-size="16" fill="#c9cec7" font-weight="normal" text-anchor="start">safe integer input; BigInt arithmetic inside the trace</text><rect x="30" y="120" width="260" height="110" fill="#2b3033" stroke="#777f7c" stroke-dasharray=""/><text x="48" y="153" font-size="21" fill="#edf0e9" font-weight="bold" text-anchor="start">start / end / step</text><text x="48" y="184" font-size="14" fill="#c9cec7" font-weight="normal" text-anchor="start">Reject zero or wrong direction</text><text x="48" y="210" font-size="14" fill="#c9cec7" font-weight="normal" text-anchor="start">Validate safe integer inputs</text><rect x="370" y="120" width="300" height="110" fill="#15191b" stroke="#e0c746" stroke-dasharray=""/><text x="390" y="153" font-size="19" fill="#e0c746" font-weight="bold" text-anchor="start">continue + under 1,000?</text><text x="390" y="184" font-size="15" fill="#edf0e9" font-weight="normal" text-anchor="start">Inclusive bound condition</text><text x="390" y="210" font-size="15" fill="#edf0e9" font-weight="normal" text-anchor="start">Explicit completion flag</text><rect x="370" y="295" width="300" height="85" fill="#313833" stroke="#777f7c" stroke-dasharray=""/><text x="390" y="327" font-size="19" fill="#edf0e9" font-weight="bold" text-anchor="start">Record value and total</text><text x="390" y="355" font-size="15" fill="#c9cec7" font-weight="normal" text-anchor="start">Increment with exact BigInt</text><rect x="805" y="120" width="265" height="80" fill="#e0c746" stroke="none" stroke-dasharray=""/><text x="825" y="152" font-size="20" fill="#202326" font-weight="bold" text-anchor="start">First 100 rows</text><text x="825" y="180" font-size="15" fill="#202326" font-weight="normal" text-anchor="start">Table preview</text><rect x="805" y="290" width="265" height="80" fill="#2b3033" stroke="#e0c746" stroke-dasharray=""/><text x="825" y="323" font-size="20" fill="#edf0e9" font-weight="bold" text-anchor="start">Full bounded trace</text><text x="825" y="351" font-size="15" fill="#c9cec7" font-weight="normal" text-anchor="start">JSON download</text><path d="M290 175 H368" fill="none" stroke="#e0c746" stroke-width="2" marker-end="url(#arrow)"/><path d="M520 230 V293" fill="none" stroke="#e0c746" stroke-width="2" marker-end="url(#arrow)"/><text x="535" y="266" font-size="14" fill="#e0c746" font-weight="normal" text-anchor="start">yes</text><path d="M370 337 H335 V175 H368" fill="none" stroke="#e0c746" stroke-width="2" marker-end="url(#arrow)"/><path d="M670 160 H803" fill="none" stroke="#e0c746" stroke-width="2" marker-end="url(#arrow)"/><text x="710" y="145" font-size="14" fill="#e0c746" font-weight="normal" text-anchor="start">stop</text><path d="M740 160 V330 H803" fill="none" stroke="#e0c746" stroke-width="2" marker-end="url(#arrow)"/><text x="30" y="438" font-size="15" fill="#c9cec7" font-weight="normal" text-anchor="start">A capped trace reports that the loop would continue. The app never evaluates arbitrary JavaScript.</text></g></svg>
